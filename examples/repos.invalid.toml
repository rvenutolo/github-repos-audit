# A deliberately INVALID example. The gate asserts `github-repos-audit validate` rejects it,
# so the failure path is proved rather than assumed: a validator that accepted
# everything would pass a gate that only ever fed it a good file.
#
# The defect is the dead override on [repos.config-files] below. Everything
# else is a copy of repos.toml in this directory, except that no type judges
# git_identity, so it needs no [identity] table. The dead override stays the
# one thing wrong with it.
#
# [types.<name>] a category of repository and what it is expected to have.
#                Every type lists every check, each set to required,
#                not_required, public, public_published or info; direct_push
#                takes blocked or allowed, renovate_min_release_age takes a
#                duration such as "7 days", not_required or info, and
#                last_release_age, last_push, open_prs, branches,
#                artifact_storage and skill_size take only info or
#                not_required.
#                A type no repository uses is allowed.
#
# [identity]     your git identity, for git_identity: canonical is the one
#                identity your commits should carry, match says which
#                identities are yours. Required once any type or override
#                judges git_identity, and refused when nothing does.
#
# [repos.<name>]
# type      which [types.*] table the repository is judged against
# published meant for someone else to find and use; default false
# overrides per-repo exceptions to the type; each needs a reason in a comment
#
# A type never implies a visibility, which is always read live from GitHub.
# An override that names an unknown check is an error, and so is an override
# that matches what the type already derives: a dead override must be
# deleted rather than left to rot.

[types.software]
readme = "required"
description = "required"
license = "public"
gitignore = "required"
ci_workflows = "required"
required_checks = "required"
ci_on_pr = "required"
ci_on_push = "required"
branch_up_to_date = "required"
ci_green = "required"
renovate = "required"
renovate_min_release_age = "7 days"
renovate_automerge_major = "required"
editorconfig = "required"
flake_nix = "required"
justfile = "required"
homepage = "public_published"
topics = "public_published"
community_files = "public_published"
releases = "required"
changelog = "required"
license_file = "public"
security_policy = "public_published"
codeowners = "not_required"
pr_template = "info"
claude_md = "required"
commitlint = "required"
git_cliff = "required"
treefmt = "required"
compose = "not_required"
typos = "required"
yamllint = "required"
markdownlint = "required"
prettier = "not_required"
