# An example repos.toml for someone else's account. Copy it into your report
# repository and replace the [repos.*] tables below with your own
# repositories. The file and the account are meant to name the same ones:
# every repository the account has gets an entry here, and every entry here
# names a repository the account has. `github-repos-audit render` reports any difference
# under Configuration drift and audits the rest.
#
# [types.<name>] a category of repository and what it is expected to have.
#                Every type lists every check, each set to required,
#                not_required, public, public_published or info; direct_push
#                takes blocked or allowed, renovate_min_release_age takes a
#                duration such as "7 days", not_required or info, and
#                last_release_age, last_push, open_prs, branches,
#                artifact_storage, skill_size, claude_mcp_config and
#                claude_settings take only info or not_required.
#                A type no repository uses is allowed.
#
# [identity]     your git identity, for git_identity: canonical is the one
#                identity your commits should carry, accepted lists others
#                of yours that are fine to find in a history, and match says
#                which identities are yours. Required once any type or
#                override judges git_identity, and refused when nothing does.
#
# [claude]       optional: marketplace names the repository holding your
#                Claude Code plugin marketplace (.claude-plugin/marketplace.json).
#                It must be one of the [repos.*] entries.
#
# [repos.<name>]
# type      which [types.*] table the repository is judged against
# published meant for someone else to find and use; default false
# overrides per-repo exceptions to the type; each should carry a reason in a
#           comment (a convention, not something the tool checks)
#
# A type never implies a visibility, which is always read live from GitHub.
# An override that names an unknown check is an error, and so is an override
# that matches what the type already derives: a dead override must be
# deleted rather than left to rot.

[types.software]
readme = "required"
description = "required"
license = "public"
gitignore = "required"
ci_workflows = "required"
required_checks = "required"
ci_on_pr = "required"
ci_on_push = "required"
branch_up_to_date = "required"
ci_green = "required"
renovate = "required"
renovate_min_release_age = "7 days"
renovate_automerge_major = "required"
editorconfig = "required"
flake_nix = "required"
justfile = "required"
homepage = "public_published"
