# Required once any type or override judges git_identity; README.md's
# "[identity] declares your git identity" section explains each key.
[identity]
canonical = "Pat Example <pat@example.com>"
accepted = ["Pat Example <12345+pat@users.noreply.github.com>"]
match = " Example <"

# Uncomment to read a plugin marketplace; the repository must have its own
# [repos.*] entry. README.md's "[claude]" section explains it.
# [claude]
# marketplace = "plugin-market"

[repos.shell-scripts]
type = "tools"

[repos.web-app]
type = "software"
published = true

[repos.go-linter]
type = "config"

[repos.recipe-site]
type = "content"
published = true
# a recipe has no secrets to scan for
overrides = { secret_scanning = "not_required" }

[repos.config-files]
type = "environment"

[repos.mixedCase-flake]
type = "infra"
