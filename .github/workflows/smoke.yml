name: smoke

# Run the live integration suite against real GitHub, read-only, once a week.
#
# Recorded fixtures pass forever while the API drifts underneath them; this
# is what notices. A failure means GitHub changed something the collector
# reads, or that the token or a fixture needs attention. It is never part of
# the gate.
#
# The suite reads two fixture repositories with a token that can read those
# two and nothing else. The token (SMOKE_TOKEN) and the three SMOKE_* names
# belong to the smoke environment, which only main may deploy to. A run from
# any other branch is refused before the job starts, so a branch that edits
# this file cannot read the token. That is also why there is no pull_request
# trigger.
on:
  schedule:
    # :31 because on-the-hour slots are the most contended on GitHub's
    # scheduler.
    - cron: "31 5 * * 2"
  workflow_dispatch:

permissions: {}

jobs:
  smoke:
    name: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: smoke
    permissions:
      contents: read
    steps:
      # Neither harden-runner nor a checkout is needed for variables or
      # secrets to be in scope — both are available from the moment the job
      # starts — so this runs first, before either, and fails as cheaply as
      # possible.
      - name: Refuse to run with an empty variable or token
        # An unset environment variable or secret is not an error to GitHub:
        # the expression is the empty string. Either one makes targets() or
        # ResolveToken() in internal/github/live_integration_test.go treat
        # the environment as unset and skip the whole suite, so the weekly
        # run would report green having tested nothing. This step closes
        # that gap by failing loudly before the devshell is even built. The
        # regex matches an all-whitespace value too, not just a truly empty
        # one, so a stray space fails the same way instead of slipping
        # through -z. The token is never echoed or put in a message — only
        # the fact that it is empty is reported.
        run: |
          fail=0
          [[ "${SMOKE_OWNER}" =~ ^[[:space:]]*$ ]] && { echo 'SMOKE_OWNER is empty' >&2; fail=1; }
          [[ "${SMOKE_PUBLIC_REPO}" =~ ^[[:space:]]*$ ]] && { echo 'SMOKE_PUBLIC_REPO is empty' >&2; fail=1; }
          [[ "${SMOKE_PRIVATE_REPO}" =~ ^[[:space:]]*$ ]] && { echo 'SMOKE_PRIVATE_REPO is empty' >&2; fail=1; }
          [[ "${SMOKE_TOKEN}" =~ ^[[:space:]]*$ ]] && { echo 'SMOKE_TOKEN is empty' >&2; fail=1; }
          exit "${fail}"
        env:
          SMOKE_OWNER: ${{ vars.SMOKE_OWNER }}
          SMOKE_PUBLIC_REPO: ${{ vars.SMOKE_PUBLIC_REPO }}
          SMOKE_PRIVATE_REPO: ${{ vars.SMOKE_PRIVATE_REPO }}
          SMOKE_TOKEN: ${{ secrets.SMOKE_TOKEN }}

      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          # TODO: restore egress-policy block once fixed upstream. doc-rot-exempt: upstream bug, cited by URL
          # Block mode drops allowed hosts on westus2: https://github.com/step-security/harden-runner/issues/708
          egress-policy: audit
          allowed-endpoints: >-
            api.github.com:443
            cache.nixos.org:443
            channels.nixos.org:443
            codeload.github.com:443
            github.com:443
            hosted-compute-*.githubapp.com:443
            install.determinate.systems:443
            nix-installer20230104193028379800000001.s3.dualstack.us-east-2.amazonaws.com:443
            nixos.org:443
            objects.githubusercontent.com:443
            proxy.golang.org:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            releases.nixos.org:443
            storage.googleapis.com:443
            sum.golang.org:443
            tarballs.nixos.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup

      - name: Run the live suite
        env:
          GITHUB_TOKEN: ${{ secrets.SMOKE_TOKEN }}
          SMOKE_OWNER: ${{ vars.SMOKE_OWNER }}
          SMOKE_PUBLIC_REPO: ${{ vars.SMOKE_PUBLIC_REPO }}
          SMOKE_PRIVATE_REPO: ${{ vars.SMOKE_PRIVATE_REPO }}
        run: ./.ci/in-devshell go test -tags=integration ./internal/github/... -count=1
