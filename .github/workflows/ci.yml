name: ci

on:
  pull_request:
  push:
    branches: [main]
  # The gate is pinned by flake.lock, but it still depends on cache.nixos.org,
  # the Nix installer and the Go module proxy. A weekly run catches those
  # breaking in a week nobody pushed, and it is the only thing that notices a
  # govulncheck advisory published against code that has not changed.
  # :47 because on-the-hour slots are the most contended on GitHub's scheduler.
  schedule:
    - cron: "47 12 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  # event_name is in the key so a scheduled run (ref = main) cannot be
  # cancelled by a push to main landing in the same window.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The whole gate - `just check` locally - under the flake's pinned tools.
  gate:
    name: gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          # Nix installer and binary cache, GitHub for the flake inputs and for
          # actions/checkout itself, the Go module proxy and checksum database
          # for `go build`, and vuln.go.dev for govulncheck. lychee runs
          # anonymously now, so it needs nothing of its own here. The Codecov
          # upload needs cli.codecov.io for its uploader binary, keybase.io for
          # the key that verifies the binary's signature, and ingest.codecov.io
          # for the upload itself (the report body then goes to
          # storage.googleapis.com, already listed).
          allowed-endpoints: >-
            api.github.com:443
            cache.nixos.org:443
            channels.nixos.org:443
            cli.codecov.io:443
            codeload.github.com:443
            github.com:443
            hosted-compute-*.githubapp.com:443
            ingest.codecov.io:443
            install.determinate.systems:443
            keybase.io:443
            nixos.org:443
            objects.githubusercontent.com:443
            proxy.golang.org:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            releases.nixos.org:443
            storage.googleapis.com:443
            sum.golang.org:443
            tarballs.nixos.org:443
            vuln.go.dev:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
      - name: Run the full gate
        # The flake's bash rather than the runner's. Not needed on ubuntu
        # (bash 5), kept so a macOS leg (stock bash 3.2, no inherit_errexit)
        # can be added without touching this step. The inner .ci/in-devshell
        # run is still --ignore-environment, so the hermetic boundary is
        # unchanged.
        shell: nix develop --command bash -o errexit {0}
        # lychee runs anonymously because every link left in this repository
        # is public; the report it used to check lived in a separate
        # repository this one no longer carries. No AUDIT_TOKEN is needed
        # here; the only secret the tool repository holds is CODECOV_TOKEN.
        run: ./.ci/in-devshell ./run-all-checks
      # Reporting only: .ci/check-coverage inside the gate is the source of
      # truth, and Codecov adds history and a per-line PR view on top of it.
      # This sits outside run-all-checks because that is what a contributor
      # runs locally, and it must not depend on a network service. It runs
      # only after a passing gate, so a partial profile from failed tests is
      # never uploaded, and it can never fail the job: an outage or a
      # rejected upload is a missing report, not a broken build. Fork PRs
      # get no secrets, so the token is empty there and the action falls back
      # to Codecov's tokenless flow on its own. codecov.yml keeps Codecov's
      # own commit statuses informational for the same reason.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        continue-on-error: true
        with:
          disable_search: true
          fail_ci_if_error: false
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}

  commitlint:
    name: commitlint
    # pull_request only: merge-commit subjects on main are not conventional.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Private repo: listing the PR's commits needs this; contents alone is
      # enough on a public repo.
      pull-requests: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: >-
            api.github.com:443
            auth.docker.io:443
            codeload.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            production.cloudflare.docker.com:443
            registry-1.docker.io:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1
