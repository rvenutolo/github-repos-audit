name: fuzz

# Actually fuzz the fuzz targets.
#
# The gate runs every `Fuzz` function against its seed corpus and nothing more:
# without `-fuzz`, no input is ever generated. This workflow is where inputs
# are generated, and it is kept out of ci.yml deliberately — fuzzing is
# unbounded work and the pull request gate must stay deterministic.
#
# Twice a week rather than weekly, because GitHub evicts a cache seven days
# after its last access: a weekly run sits exactly on that boundary and the
# corpus would keep cold-starting from the seeds.
#
# A crasher is filed as a pull request rather than lost with the run (why:
# .ci/fuzz-pull-request); the run still fails afterwards, so a finding also
# arrives by mail. A target that fails at its deadline without writing an input
# is retried once rather than failing the run (why: .ci/run-fuzz). A failed
# scheduled run, for any reason, is also recorded in an open issue (why:
# .ci/fuzz-failure-issue).
on:
  schedule:
    # :17 because on-the-hour slots are the most contended on GitHub's
    # scheduler. Sunday and Wednesday: gaps of three and four days.
    - cron: "17 4 * * 0,3"
  workflow_dispatch:
    inputs:
      duration:
        description: Fuzz time per target, as a Go duration.
        required: false
        default: 5m

permissions: {}

concurrency:
  # Two runs must not race on the same corpus cache or the same crasher branch.
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    # Every target at the 5m default plus the Nix and Go restores, with room for
    # a deadline-only retry (one more target's worth) and a longer dispatched
    # duration. A new fuzz target adds five minutes; raise this with it.
    timeout-minutes: 60
    # contents: read is for actions/checkout and nothing else. The pull request
    # a crasher produces is opened with REFRESH_TOKEN for the same reason the
    # refresh does (audit.yml): the built-in token's pull request would get no
    # checks — and a red gate on the input is the entire point here.
    permissions:
      contents: read
    outputs:
      summary: ${{ steps.summary.outputs.summary }}
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >-
            api.github.com:443
            cache.nixos.org:443
            channels.nixos.org:443
            codeload.github.com:443
            github.com:443
            hosted-compute-*.githubapp.com:443
            install.determinate.systems:443
            nix-installer20230104193028379800000001.s3.dualstack.us-east-2.amazonaws.com:443
            nixos.org:443
            objects.githubusercontent.com:443
            proxy.golang.org:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            releases.nixos.org:443
            storage.googleapis.com:443
            sum.golang.org:443
            tarballs.nixos.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup

      # The generated corpus lives at $GOCACHE/fuzz. GOCACHE is a directory
      # per toolchain, but flake.nix's shellHook links every one's fuzz
      # directory to the single path cached here, so the corpus outlives a
      # toolchain change. The setup action restores this path too, but only
      # ci.yml's gate saves those caches, so this job's corpus would never be
      # kept; without this pair it would reset to the seeds every run.
      # restore/save rather than
      # actions/cache, because the latter skips its save when the job fails,
      # which is exactly the run whose corpus is worth keeping.
      - name: Restore the fuzz corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/github-repos-audit/go-build/fuzz
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-

      - name: Fuzz every target
        id: fuzz
        # The job must reach the filing step even when a target fails; the last
        # step turns that failure back into a red run.
        continue-on-error: true
        env:
          # Through the environment, never interpolated into the script.
          DURATION: ${{ inputs.duration || '5m' }}
        # bash, not the default shell, for pipefail: without it the step's
        # status would be tee's, and a failed target would read as a pass.
        shell: bash
        run: ./.ci/in-devshell ./.ci/run-fuzz "${DURATION}" 2>&1 | tee "${RUNNER_TEMP}/run-fuzz.log"

      - name: Collect the target summary
        id: summary
        # Read by report-failure. A run that failed before fuzzing has no log,
        # and an empty summary says so.
        if: always()
        shell: bash
        run: |
          {
            printf 'summary<<FUZZ_SUMMARY_END\n'
            if [[ -f "${RUNNER_TEMP}/run-fuzz.log" ]]; then
              sed --quiet --regexp-extended 's/^\[run-fuzz\] INFO   ((PASS|CRASH|FAIL) .*)$/\1/p' \
                "${RUNNER_TEMP}/run-fuzz.log"
            fi
            printf 'FUZZ_SUMMARY_END\n'
          } >> "${GITHUB_OUTPUT}"

      - name: File any new crasher as a pull request
        # REFRESH_TOKEN reaches this repository alone, with Contents and Pull
        # requests write and nothing else.
        env:
          GH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: ./.ci/in-devshell ./.ci/fuzz-pull-request

      - name: Save the fuzz corpus
        # Only from the default branch: a dispatch on another branch would
        # save the corpus under that branch's ref, which the scheduled runs
        # on the default branch never restore.
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/github-repos-audit/go-build/fuzz
          key: fuzz-corpus-${{ github.run_id }}

      # A target failed: CRASH or FAIL in the summary above, and the fuzz
      # step's log says which and what it means.
      - name: Fail because a target failed
        if: steps.fuzz.outcome == 'failure'
        run: exit 1

  # A separate job, so it still runs when the fuzz job is killed at its
  # timeout, and so issues: write is granted here alone. It needs no Nix: the
  # script uses only bash and gh, which the runner ships. Scheduled runs only:
  # a dispatched run has someone watching it.
  report-failure:
    name: report failure
    needs: fuzz
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >-
            api.github.com:443
            github.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .ci/fuzz-failure-issue
            .ci/lib.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Record the failure in an issue
        # Through the environment, never interpolated into the script.
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_SHA: ${{ github.sha }}
          FUZZ_SUMMARY: ${{ needs.fuzz.outputs.summary }}
        run: ./.ci/fuzz-failure-issue
