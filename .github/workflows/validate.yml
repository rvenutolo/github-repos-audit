name: validate

# Validate the CALLER's configuration and committed report without changing
# anything. The caller is a report repository holding only repos.toml, the
# generated README.md and audit.json; this workflow is the tool.
#
# Only .ci/fetch-release-binary and the library it sources are checked out
# from the tool, at the commit the caller pinned: the workflow runs the
# binary released from that commit, not source, so nothing else is needed and
# no Nix or Go toolchain is installed. The script downloads the binary,
# checks it against the release's SHA256SUMS and verifies that its build
# provenance names this repository's release workflow on main and that exact
# commit. Any failure, including an unreachable attestation service, fails the
# run, and a pin that is not a release's commit fails with a message saying
# so. The caller lands under report/, which is what --config and --audit name.
# validate checks repos.toml and, when the file exists, audit.json against the
# schema embedded in the binary; it does not lint the report's formatting.
on:
  workflow_call: {}

permissions: {}

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          # Exactly what fetching and verifying the release binary and both
          # checkouts reach: the API and release assets, the checkout tarballs,
          # and Sigstore's TUF root for the attestation check.
          allowed-endpoints: >-
            api.github.com:443
            codeload.github.com:443
            github.com:443
            hosted-compute-*.githubapp.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
      # Only the files the fetch needs, from the exact commit the caller
      # pinned. The patterns are files, so cone mode is off.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          sparse-checkout: |
            .ci/fetch-release-binary
            .ci/lib.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      # The caller's own repository, which holds the config and the report.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: report
          persist-credentials: false

      - name: Fetch and verify the release binary
        id: tool
        # The built-in token only downloads public release assets and reads
        # their attestation, so it needs no access to the account. The
        # expressions arrive through env so none is spliced into script text.
        env:
          GH_TOKEN: ${{ github.token }}
          TOOL_REPO: ${{ job.workflow_repository }}
          TOOL_SHA: ${{ job.workflow_sha }}
        run: |
          # Assigned before it is echoed: a command substitution inside echo
          # would hide the script's exit status and let a failed verification
          # pass.
          path="$(./.ci/fetch-release-binary \
            --repo "${TOOL_REPO}" \
            --sha "${TOOL_SHA}" \
            --out "${RUNNER_TEMP}/github-repos-audit")"
          echo "path=${path}" >>"${GITHUB_OUTPUT}"

      - name: Validate the configuration and the report
        env:
          TOOL: ${{ steps.tool.outputs.path }}
        run: |
          args=(--config report/repos.toml)
          # Absent on a report repository's first run, which is not a failure.
          if [[ -f report/audit.json ]]; then
            args+=(--audit report/audit.json)
          else
            echo 'report/audit.json does not exist yet; checking repos.toml alone.'
          fi
          "${TOOL}" validate "${args[@]}"
