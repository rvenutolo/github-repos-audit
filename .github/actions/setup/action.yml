name: setup
# Caller must run harden-runner and actions/checkout before this composite: a
# local action cannot perform its own initial checkout.
description: Install Nix, restore the Nix store cache and restore the Go caches.
runs:
  using: composite
  steps:
    - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
    - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
      with:
        primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
        restore-prefixes-first-match: nix-${{ runner.os }}-
    # .ci/in-devshell keeps HOME but no GO* variables, so the module and build
    # caches resolve under ~/go and ~/.cache/go-build. cache-nix-action covers
    # the Nix store and not those, so they are cached here or every run
    # re-downloads the module graph and recompiles the standard library.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
        restore-keys: go-${{ runner.os }}-
