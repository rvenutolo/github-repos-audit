# The six repository types this project judged against when the matrix lived
# in Go, as [types.*] tables. A test fixture: rules, render and cmd/audit tests
# read it, so they do not move when this repository's own repos.toml does.

[types.software]
readme = "required"
description = "required"
license = "public"
gitignore = "required"
ci_workflows = "required"
required_checks = "required"
ci_green = "required"
renovate = "required"
editorconfig = "required"
flake_nix = "required"
justfile = "required"
homepage = "public_published"
topics = "public_published"
community_files = "public_published"
releases = "required"
changelog = "required"
signed_commits = "required"
tag_ruleset = "required"
direct_push = "blocked"
secret_scanning = "public"
vuln_reporting = "public"
last_release_age = "info"
last_push = "info"
open_prs = "info"
branches = "info"

