# The six repository types this project judged against when the matrix lived
# in Go, as [types.*] tables, plus the [identity] table git_identity needs. A
# test fixture: rules, render and cmd/github-repos-audit tests read it, so they
# do not move when this repository's own repos.toml does.

[types.software]
readme = "required"
description = "required"
license = "public"
gitignore = "required"
ci_workflows = "required"
required_checks = "required"
ci_on_pr = "required"
ci_on_push = "required"
branch_up_to_date = "required"
ci_green = "required"
renovate = "required"
renovate_min_release_age = "7 days"
renovate_automerge_major = "required"
editorconfig = "required"
flake_nix = "required"
justfile = "required"
homepage = "public_published"
topics = "public_published"
community_files = "public_published"
releases = "required"
changelog = "required"
license_file = "public"
security_policy = "public_published"
codeowners = "not_required"
pr_template = "info"
claude_md = "not_required"
commitlint = "required"
git_cliff = "not_required"
treefmt = "not_required"
compose = "not_required"
typos = "not_required"
yamllint = "not_required"
markdownlint = "not_required"
prettier = "not_required"
editorconfig_checker = "not_required"
lychee = "not_required"
zizmor = "not_required"
codecov = "not_required"
mkdocs = "not_required"
signed_commits = "required"
git_identity = "required"
tag_ruleset = "required"
direct_push = "blocked"
secret_scanning = "public"
vuln_reporting = "public"
nix_lock_age = "required"
nix_lock_refresh = "required"
nix_cache = "required"
go_cache = "required"
cache_usage = "required"
ci_cancel_superseded = "required"
job_timeouts = "required"
skill_slash_only = "required"
skill_name_matches_dir = "required"
skill_known_keys = "required"
skill_description_length = "required"
skill_no_wrapper_commands = "required"
hook_known_events = "required"
hook_command_executable = "required"
hook_plugin_root = "required"
hook_timeout = "required"
hook_matcher = "required"
last_release_age = "info"
last_push = "info"
open_prs = "info"
branches = "info"
artifact_storage = "info"
skill_size = "info"

